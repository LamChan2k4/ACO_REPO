server {
    listen 80;
    
    # ✅ 1. TĂNG DUNG LƯỢNG FILE NẠP VÀO
    # Đồ thị DIMACS có thể rất nặng, cho phép lên tới 100MB để thoải mái nghiên cứu
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ✅ 2. CẤU HÌNH API PROXY (CHỐNG SẬP CHO PENTIUM)
    location /api/ {
        # Chú ý: Tên aco-api phải khớp với container_name trong docker-compose.yml
        proxy_pass http://aco-api:8081; 
        
        # Header tiêu chuẩn để Java nhận diện được IP người dùng thật
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ 3. CHỐNG LỖI BROKEN PIPE & TIMEOUT
        # Tăng thời gian chờ lên 1 tiếng (3600s) vì Pentium giải NP-Hard cực lâu
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;

        # ✅ 4. TỐI ƯU HÓA TRUYỀN TẢI DỮ LIỆU LỚN
        # Tắt đệm (Buffering) để kết quả từ Java đẩy thẳng về Web ngay khi có
        # Giúp giảm tải cho RAM 8GB của Server
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Hỗ trợ kết nối bền vững
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}